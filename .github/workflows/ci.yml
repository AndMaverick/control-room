name: CI
on: [push, pull_request]
jobs:
  harness:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Harness tests
        run: python -I -m unittest discover -s tests -t . -v -p "test_*.py"
      - name: Inquiry builder tests
        run: node --test tests/review.test.js
      - name: Manifest is current
        run: |
          python build.py
          git diff --exit-code py/manifest.json
  inquiry-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check the edge function
        run: deno check backend/supabase/functions/inquiry/index.ts
      - name: Inquiry service tests
        run: deno test --no-check backend/tests/inquiry_test.ts
